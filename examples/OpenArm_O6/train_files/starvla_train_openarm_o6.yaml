run_id: openarm_o6_qwengroot_right_only
# All checkpoints/logs go under run_root_dir/run_id.
run_root_dir: ../artifacts/checkpoints/starvla
seed: 42
wandb_entity: null
wandb_project: starVLA_OpenArm_O6
is_debug: false
version_id: "0.21"

framework:
  # QwenGR00T uses a Qwen-VL backbone plus the flow-matching / DiT action head.
  name: QwenGR00T
  qwenvl:
    # The training script can override this with --framework.qwenvl.base_vlm.
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    # Requires CUDA-visible FlashAttention2. Use eager/sdpa only for debugging.
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    # Right-only OpenArm O6 space:
    #   right arm 7 DOF + right LinkerHand O6 6 DOA = 13.
    action_dim: 13
    state_dim: 13
    # Must match action_indices=list(range(16)) in data_registry/data_config.py.
    action_horizon: 16
    # Repeats each action target with several noise samples for the FM/DiT loss.
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

datasets:
  vla_data:
    # This imports starVLA/dataloader/lerobot_datasets.py.
    dataset_py: lerobot_datasets
    # Include the 13-D right-side proprioceptive state in the model input.
    include_state: true
    # data_mix below resolves to <data_root_dir>/OpenArm_O6_CanSorting_dataset_0408.
    # Local path on this RTX 4090 box; override with --datasets.vla_data.data_root_dir
    # if your dataset lives elsewhere.
    data_root_dir: ../datasets
    data_mix: openarm_o6_cansort_right_only
    # The dataset action values are absolute joint positions, not deltas.
    action_type: abs_qpos
    action_mode: abs
    # With the VLM unfrozen, per-step VRAM roughly doubles vs the previous
    # bs16 frozen run. On a 24 GB 4090, start at 4 and rely on
    # gradient_accumulation_steps=4 (below) for the effective bs=16. On
    # 80 GB (H100/A100) you can raise this to 8-16 and lower grad_accum.
    per_device_batch_size: 4
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: torchvision_av
    lerobot_version: v2.0

trainer:
  # Unfreeze the VLM and train longer than the previous bs16_lr5e5_wd1e5 run, 
  # which left the Qwen backbone frozen and capped at 100k steps. 
  # Unfreezing lets Qwen adapt to the can-sorting visual domain
  # and is the highest-impact single change available without retooling.
  # Override any of these from the CLI via `--trainer.<field> <value>`.
  max_train_steps: 200000   # was 100000
  num_warmup_steps: 1000
  save_interval: 2000
  eval_interval: 2000
  learning_rate:
    # Two-pronged schedule: keep the VLM updates small (it's already
    # pretrained on web-scale image+text), and give the action head the
    # larger LR (it still has the most to learn). The min_lr below applies
    # to all groups.
    base: 5.0e-06               # was 1.0e-05
    qwen_vl_interface: 5.0e-06  # was 1.0e-05
    action_model: 5.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  # The previous run pinned `freeze_modules: qwen_vl_interface`, 
  # which froze the entire 4B Qwen3-VL backbone — the model never adapted to OpenArm O6 visuals. 
  # Removing the freeze ~doubles VRAM use (extra activations + gradients for the VLM),
  # so drop per_device_batch_size and raise gradient_accumulation_steps if
  # you OOM on a 24 GB card.
  freeze_modules: ""  # Empty string == nothing frozen. # was "qwen_vl_interface"
  loss_scale:
    # This config is robot-action training only; no separate VLM data stream.
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-05
  save_format: pt
